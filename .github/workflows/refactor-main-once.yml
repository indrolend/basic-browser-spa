name: Refactor main item runtime once

on:
  push:
    branches:
      - audit/current-spa-lifecycle
    paths:
      - scripts/refactor-main-item-runtime-v3.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/current-spa-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refactor-main-item-runtime-v3.mjs
      - run: npm test
      - name: Commit generated runtime migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "No main.js changes generated"
            exit 1
          fi
          git commit -m "Migrate SPA shell to item application contracts"
          git push origin HEAD:audit/current-spa-lifecycle
